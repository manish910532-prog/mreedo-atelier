<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access | Mreedo Atelier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-8 relative shadow-2xl">
    <a href="/" class="text-xs text-amber-400 hover:underline mb-6 inline-block">← Back to Store</a>
    
    <h1 id="auth-title" class="text-2xl font-bold text-white mb-2">Sign In</h1>
    <p class="text-xs text-zinc-400 mb-6">Manage your bespoke orders and saved addresses.</p>

    <form onsubmit="handleAuth(event)" class="space-y-4">
      <input type="text" id="name-input" placeholder="Full Name" class="hidden w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
      <input type="email" id="email-input" required placeholder="Email Address" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
      <input type="password" id="password-input" required placeholder="Password" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
      
      <div id="terms-box" class="hidden items-center gap-2">
        <input type="checkbox" id="terms-check" class="rounded border-zinc-700 bg-zinc-800 text-amber-500">
        <label for="terms-check" class="text-xs text-zinc-400">I agree to the <a href="/terms.html" class="text-amber-400 underline">Terms, Conditions & Policies</a></label>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 bg-amber-500 text-black font-bold rounded-xl text-sm hover:bg-amber-400 transition">Sign In</button>
    </form>

    <div class="mt-6 text-center">
      <button onclick="toggleMode()" id="switch-btn" class="text-xs text-amber-400 hover:underline">Don't have an account? Sign Up</button>
    </div>
  </div>

  <script>
    let isSignup = false;
    function toggleMode() {
      isSignup = !isSignup;
      document.getElementById('auth-title').innerText = isSignup ? 'Create Account' : 'Sign In';
      document.getElementById('submit-btn').innerText = isSignup ? 'Sign Up' : 'Sign In';
      document.getElementById('name-input').classList.toggle('hidden', !isSignup);
      document.getElementById('terms-box').classList.toggle('hidden', !isSignup);
      document.getElementById('terms-box').classList.toggle('flex', isSignup);
      document.getElementById('switch-btn').innerText = isSignup ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email-input').value;
      const name = document.getElementById('name-input').value || 'Member';

      if (isSignup && !document.getElementById('terms-check').checked) {
        alert('Please agree to the Terms & Conditions.');
        return;
      }

      const user = {
        name: name,
        email: email,
        role: email.toLowerCase().includes('admin') ? 'admin' : 'customer'
      };
      localStorage.setItem('mreedo_user', JSON.stringify(user));
      window.location.href = '/'; // Sign in hone par direct wapas store par
    }
  </script>
</body>
</html>
