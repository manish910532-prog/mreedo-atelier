<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MREEDO | Luxury Streetwear & Fashion Atelier</title>
  <meta name="application-name" content="Dream Store India">

  <!-- Schema Markup for Site Name -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Dream Store India",
    "alternateName": ["Mreedo Atelier", "Dream Store"],
    "url": "https://mreedo-atelier.onrender.com/"
  }
  </script>

  <meta name="google-site-verification" content="google4226d4fbf78612e8.html" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="apple-touch-icon" href="/logo.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .brand-font { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-zinc-950/95 backdrop-blur border-b border-zinc-800">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-3">
        <img src="/logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/100x100?text=M'" class="h-9 w-9 rounded-full object-cover border border-amber-500/40">
        <div class="flex flex-col">
          <span class="brand-font text-lg sm:text-xl font-bold tracking-wider text-amber-400 leading-none">MREEDO</span>
          <span class="text-[9px] uppercase tracking-widest text-zinc-400">Atelier • India</span>
        </div>
      </a>

      <!-- Right Nav Buttons -->
      <div class="flex items-center gap-3 sm:gap-4">
        
        <!-- Cart Page Link -->
        <a href="/cart.html" class="relative p-2 text-zinc-300 hover:text-white transition flex items-center gap-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5">
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="text-xs font-semibold">Cart</span>
          <span id="cart-counter" class="ml-1 bg-amber-500 text-black text-[11px] font-bold px-1.5 py-0.2 rounded-full">0</span>
        </a>

        <!-- Admin (Only for Admin users) -->
        <a id="admin-btn" href="/admin.html" class="hidden text-xs bg-red-950/80 text-red-300 border border-red-800 px-2.5 py-1.5 rounded-lg">Admin</a>

        <!-- Guest: Sign In -->
        <div id="guest-actions">
          <a href="/auth.html" class="text-xs sm:text-sm px-4 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-medium border border-zinc-700 transition inline-block">Sign In</a>
        </div>

        <!-- User: Profile Button -->
        <div id="user-actions" class="hidden">
          <a href="/profile.html" class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:border-amber-500/50 px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-200">
            <span id="user-initial" class="h-6 w-6 bg-amber-500 text-black font-bold rounded-full flex items-center justify-center text-[10px]">U</span>
            <span id="user-display-name">Profile</span>
          </a>
        </div>

      </div>
    </div>
  </header>

  <!-- Hero & Products -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div class="mb-8 border-b border-zinc-800 pb-6">
      <span class="text-xs font-semibold uppercase tracking-widest text-amber-500">Democratizing Bespoke Luxury</span>
      <h1 class="brand-font text-2xl sm:text-4xl font-bold tracking-tight text-white mt-1">Curated Luxury Streetwear</h1>
      <p class="text-xs sm:text-sm text-zinc-400 mt-1">Superior fiber density • 240+ GSM structural cuts • Zero middleman markups</p>
    </div>

    <!-- Product Grid -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-zinc-800 bg-zinc-950 py-6">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-400">
      <p>© 2026 Dream Store India • Mreedo Atelier. All Rights Reserved.</p>
      <div class="flex items-center gap-4">
        <a href="/terms.html" class="hover:text-amber-400 transition">Terms & Privacy Policy</a>
        <a href="/cart.html" class="hover:text-amber-400 transition">View Cart</a>
      </div>
    </div>
  </footer>

  <script>
    const products = [
      { id: 1, name: "Oversized Heavyweight Tee - Noir", price: 2499, fabric: "260 GSM French Terry Cotton", image: "/tee1.jpg" },
      { id: 2, name: "Vintage Acid Wash Tee", price: 2799, fabric: "240 GSM Combed Cotton", image: "/tee2.jpg" },
      { id: 3, name: "Atelier Signature Minimal Tee", price: 2299, fabric: "250 GSM Luxury Interlock", image: "/tee3.jpg" },
      { id: 4, name: "Monochrome Street Silhouette Tee", price: 2999, fabric: "280 GSM Heavy Jersey", image: "/tee4.jpg" }
    ];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      if (!grid) return;

      grid.innerHTML = products.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col">
          <div class="aspect-square bg-zinc-800 overflow-hidden relative">
            <img src="${item.image}" alt="${item.name}" onerror="this.src='/logo.jpg'" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 bg-black/80 text-[10px] text-zinc-300 font-medium px-2 py-0.5 rounded border border-zinc-700">${item.fabric}</span>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div>
              <h3 class="font-semibold text-sm text-zinc-100">${item.name}</h3>
              <p class="text-amber-400 font-bold text-base mt-1">₹${item.price.toLocaleString('en-IN')}</p>
            </div>
            <button onclick="addToCart(${item.id})" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold rounded-xl transition">
              Add to Bag & View Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateCartCounter() {
      const cart = JSON.parse(localStorage.getItem('mreedo_cart') || '[]');
      const counter = document.getElementById('cart-counter');
      if (counter) counter.innerText = cart.length;
    }

    function addToCart(productId) {
      let cart = JSON.parse(localStorage.getItem('mreedo_cart') || '[]');
      const item = products.find(p => p.id === productId);
      if (item) {
        cart.push(item);
        localStorage.setItem('mreedo_cart', JSON.stringify(cart));
        window.location.href = '/cart.html'; // Direct Cart page open hoga!
      }
    }

    function checkAuth() {
      const user = JSON.parse(localStorage.getItem('mreedo_user') || 'null');
      const guest = document.getElementById('guest-actions');
      const userAct = document.getElementById('user-actions');
      const adminBtn = document.getElementById('admin-btn');

      if (user) {
        guest.classList.add('hidden');
        userAct.classList.remove('hidden');
        document.getElementById('user-initial').innerText = (user.name || user.email || 'U')[0].toUpperCase();
        document.getElementById('user-display-name').innerText = user.name ? user.name.split(' ')[0] : 'Profile';

        if (user.role === 'admin') adminBtn.classList.remove('hidden');
      } else {
        guest.classList.remove('hidden');
        userAct.classList.add('hidden');
        adminBtn.classList.add('hidden');
      }
    }

    renderProducts();
    updateCartCounter();
    checkAuth();
  </script>
</body>
</html>
