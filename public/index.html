<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MREEDO | Luxury Streetwear & Fashion Atelier</title>
  <meta name="application-name" content="Dream Store India">

  <!-- Schema Markup -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Dream Store India",
    "alternateName": ["Mreedo Atelier", "Dream Store"],
    "url": "https://mreedo-atelier.onrender.com/"
  }
  </script>

  <!-- Favicons -->
  <link rel="icon" type="image/jpeg" href="https://mreedo-atelier.onrender.com/logo.jpg">
  <link rel="apple-touch-icon" href="https://mreedo-atelier.onrender.com/logo.jpg">

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .brand-font { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased">

  <!-- Universal Responsive Navbar -->
  <header class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Title -->
      <a href="/" class="flex items-center gap-3">
        <img src="/logo.jpg" alt="Logo" class="h-9 w-9 rounded-full object-cover border border-amber-500/40">
        <span class="brand-font text-lg sm:text-xl font-bold tracking-wider text-amber-400">MREEDO</span>
      </a>

      <!-- Desktop & Mobile Right Actions -->
      <div class="flex items-center gap-4">
        
        <!-- Cart Link (Dedicated Page) -->
        <a href="/cart.html" class="relative p-2 text-zinc-300 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="cart-counter" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center">0</span>
        </a>

        <!-- Admin Option (Hidden by default, shown ONLY to admins) -->
        <a id="admin-nav-btn" href="/admin.html" class="hidden text-xs bg-red-950/80 text-red-300 border border-red-800 px-2.5 py-1 rounded">Admin</a>

        <!-- Guest View: Auth Buttons -->
        <div id="guest-auth-actions" class="flex items-center gap-2">
          <button onclick="openModal('auth-modal')" class="text-xs sm:text-sm px-3 py-1.5 rounded border border-zinc-700 hover:bg-zinc-800 transition">Sign In</button>
        </div>

        <!-- User Profile Dropdown (Shown when logged in) -->
        <div id="user-menu" class="hidden relative">
          <button onclick="toggleDropdown('profile-dropdown')" class="flex items-center gap-2 text-sm border border-zinc-800 p-1.5 rounded-full hover:border-amber-500/50">
            <span id="user-avatar-initial" class="h-7 w-7 bg-amber-500 text-black font-bold rounded-full flex items-center justify-center text-xs">U</span>
          </button>
          
          <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-52 bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl py-2 z-50">
            <p id="user-dropdown-name" class="px-4 py-1.5 text-xs text-zinc-400 font-semibold border-b border-zinc-800 truncate">Account</p>
            <a href="/profile.html" class="block px-4 py-2 text-sm text-zinc-200 hover:bg-zinc-800">My Profile & Orders</a>
            <button onclick="deleteAccount()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-zinc-800">Delete Account Permanently</button>
            <button onclick="logoutUser()" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800 border-t border-zinc-800">Sign Out</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Hero & Product Showcase (Fluid Grid for all displays) -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <h1 class="brand-font text-2xl sm:text-4xl font-bold tracking-tight text-white">Curated Luxury Streetwear</h1>
        <p class="text-xs sm:text-sm text-zinc-400 mt-1">Democratizing Bespoke Luxury • 240+ GSM Fabrics</p>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Products render dynamically via JS -->
    </div>
  </main>

  <!-- Auth Modal (Sign in / Sign up with Terms Checkbox) -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="closeModal('auth-modal')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
      
      <h3 id="auth-title" class="text-xl font-bold text-white mb-2">Sign In</h3>
      <p class="text-xs text-zinc-400 mb-4">Access your orders, saved addresses, and tailored fitting.</p>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <input type="text" id="auth-name" placeholder="Full Name" class="hidden w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded text-sm text-white focus:outline-none focus:border-amber-500">
        <input type="email" id="auth-email" required placeholder="Email Address" class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded text-sm text-white focus:outline-none focus:border-amber-500">
        <input type="password" id="auth-password" required placeholder="Password" class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded text-sm text-white focus:outline-none focus:border-amber-500">
        
        <div id="terms-box" class="hidden items-center gap-2">
          <input type="checkbox" id="terms-check" class="rounded border-zinc-700 bg-zinc-800 text-amber-500">
          <label for="terms-check" class="text-xs text-zinc-400">I agree to the <a href="/terms.html" class="text-amber-400 underline">Terms & Conditions</a></label>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-2 bg-amber-500 text-black font-semibold rounded text-sm hover:bg-amber-400 transition">Sign In</button>
      </form>

      <div class="mt-4 text-center">
        <button id="toggle-auth-btn" onclick="toggleAuthMode()" class="text-xs text-amber-400 hover:underline">Don't have an account? Sign Up</button>
      </div>
    </div>
  </div>

  <!-- Footer with Legal & Contact -->
  <footer class="mt-auto border-t border-zinc-800 bg-zinc-950 py-6">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-400">
      <p>© 2026 Dream Store India • Mreedo Atelier. All Rights Reserved.</p>
      <div class="flex gap-4">
        <a href="/terms.html" class="hover:text-white">Terms & Conditions</a>
        <a href="/terms.html#privacy" class="hover:text-white">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <script>
    // State
    let isSignUp = false;
    let currentUser = JSON.parse(localStorage.getItem('mreedo_user') || 'null');

    // UI Initializer
    function renderUserNav() {
      const guestActions = document.getElementById('guest-auth-actions');
      const userMenu = document.getElementById('user-menu');
      const adminBtn = document.getElementById('admin-nav-btn');

      if (currentUser) {
        guestActions.classList.add('hidden');
        userMenu.classList.remove('hidden');
        document.getElementById('user-avatar-initial').innerText = (currentUser.name || currentUser.email)[0].toUpperCase();
        document.getElementById('user-dropdown-name').innerText = currentUser.email;

        // Admin check: Only show if user has admin role
        if (currentUser.role === 'admin') {
          adminBtn.classList.remove('hidden');
        } else {
          adminBtn.classList.add('hidden');
        }
      } else {
        guestActions.classList.remove('hidden');
        userMenu.classList.add('hidden');
        adminBtn.classList.add('hidden');
      }
    }

    function toggleDropdown(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    function openModal(id) {
      window.history.pushState({ modalOpen: true }, '', '#' + id);
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (window.location.hash) history.back();
    }

    // Handle Browser Back Button for Popups
    window.addEventListener('popstate', () => {
      document.querySelectorAll('.fixed:not(.hidden)').forEach(el => el.classList.add('hidden'));
    });

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? 'Create Account' : 'Sign In';
      document.getElementById('auth-submit-btn').innerText = isSignUp ? 'Sign Up' : 'Sign In';
      document.getElementById('auth-name').classList.toggle('hidden', !isSignUp);
      document.getElementById('terms-box').classList.toggle('hidden', !isSignUp);
      document.getElementById('terms-box').classList.toggle('flex', isSignUp);
      document.getElementById('toggle-auth-btn').innerText = isSignUp 
        ? 'Already have an account? Sign In' 
        : "Don't have an account? Sign Up";
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const name = document.getElementById('auth-name').value || 'Customer';

      if (isSignUp && !document.getElementById('terms-check').checked) {
        alert('Please agree to the Terms & Conditions.');
        return;
      }

      // Save user session
      currentUser = { email, name, role: email.includes('admin') ? 'admin' : 'customer' };
      localStorage.setItem('mreedo_user', JSON.stringify(currentUser));
      closeModal('auth-modal');
      renderUserNav();
    }

    function logoutUser() {
      localStorage.removeItem('mreedo_user');
      currentUser = null;
      renderUserNav();
      window.location.reload();
    }

    function deleteAccount() {
      if (confirm('Warning: Are you sure you want to permanently delete your account and all order records? This cannot be undone.')) {
        localStorage.removeItem('mreedo_user');
        localStorage.removeItem('mreedo_cart');
        alert('Your account has been deleted.');
        window.location.reload();
      }
    }

    renderUserNav();
  </script>
</body>
</html>
